<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title | default: "NewbieRead 新手教程" }}</title>
    {% if page.description %}
    <meta name="description" content="{{ page.description }}">
    {% endif %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
    <header class="navbar">
        <div class="container nav-container">
            <div class="nav-brand">📚 NewbieRead</div>
            <nav class="nav-links">
                <a href="{{ '/' | relative_url }}">首页</a>
                <a href="{{ '/01-新手开头.html' | relative_url }}">新手入门</a>
                <a href="{{ '/' | relative_url }}">教程目录</a>
            </nav>
        </div>
    </header>

    <main class="container article-container">
        {{ content }}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; {{ site.time | date: '%Y' }} NewbieRead 新手手册. 持续优化更新中。</p>
        </div>

</body>
</html>
